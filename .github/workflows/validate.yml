name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"  # daily, so a change in HACS or hassfest shows up without a push
  workflow_dispatch:

permissions: {}

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  card:
    name: dashboard card (lint, build, bundle current, Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: card
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: card/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Check the committed bundle is current
        run: git diff --exit-code -- ../custom_components/brother_scanner/www/ || { echo "the card bundle is stale: run npm run build in card/ and commit"; exit 1; }
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  tests:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test.txt
      - run: python -m pytest tests -q --cov=custom_components/brother_scanner --cov-report=term-missing --cov-fail-under=90
